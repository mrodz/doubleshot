[package]
name = "doubleshot"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "A generic blue-green deployment helper that watches an inbox, verifies application health, and orchestrates traffic switching."
readme = "README.md"
repository = "https://github.com/mrodz/doubleshot" # Update this
keywords = ["deployment", "blue-green", "nginx", "daemon", "devops"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[features]
docker-tests = []

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
nginx-config = "0.13.2"
serde = { version = "1.0.203", features = ["derive"] }
toml = "0.8.14"

[dev-dependencies]
testcontainers = { version = "0.27.3", features = ["blocking"] }
