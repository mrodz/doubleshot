[package]
name = "doubleshot"
version = "0.1.0"
edition = "2024"

[features]
docker-tests = []

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
nginx-config = "0.13.2"
serde = { version = "1.0.203", features = ["derive"] }
toml = "0.8.14"

[dev-dependencies]
testcontainers = { version = "0.27.3", features = ["blocking"] }
